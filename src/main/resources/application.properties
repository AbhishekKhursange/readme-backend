spring.application.name=readMe
server.port=8080

# --- Neon Postgres ---
# Get this connection string from your Neon dashboard (Connection Details -> Java/JDBC)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/placeholder}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=45000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Cloudinary ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Redis (used for refresh tokens) ---
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

# --- JWT ---
# Override JWT_SECRET with a long random string (32+ bytes) before any real deployment.
jwt.secret=${JWT_SECRET:changeme-generate-a-real-one}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# --- File upload limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB